name: Windows desktop release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check tag and install dependencies
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag and package version differ: $env:GITHUB_REF_NAME / $version" }
          npm install --global pnpm@12.4.2
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
      - name: Test native Windows runtime
        shell: pwsh
        run: |
          $env:FRAME_BROWSER = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          node --test tests/server/local-mode.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows local mode failed' }
      - name: Build complete desktop archive
        shell: pwsh
        run: |
          ./desktop/package.ps1 -IncludeSpeech
          if ($LASTEXITCODE -ne 0) { throw 'Windows package failed' }
      - name: Publish GitHub Release with the matching tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $asset = ".cache/release/FrameStudio-v$version-win-x64.zip"
          $checksum = "$asset.sha256"
          if (-not (Test-Path -LiteralPath $asset) -or -not (Test-Path -LiteralPath $checksum)) { throw 'Release assets are missing' }
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $asset $checksum --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $asset $checksum --verify-tag --title "FRAME Studio $version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
