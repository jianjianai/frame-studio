name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag to release (without v)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.source.outputs.version }}
      revision: ${{ steps.source.outputs.revision }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && format('refs/tags/v{0}', inputs.version) || github.ref }}
      - id: source
        env:
          TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$TAG" = "v$VERSION" || { echo 'Tag and package version differ'; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: source
    uses: ./.github/workflows/verify.yml
    with:
      source_ref: ${{ needs.source.outputs.revision }}
  windows:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: "26.8.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        shell: pwsh
        run: |
          npm install --global pnpm@12.4.2
          if ($LASTEXITCODE -ne 0) { throw 'pnpm installation failed' }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
      - name: Test dependency provisioning
        shell: pwsh
        run: |
          ./tests/desktop/bootstrap.test.ps1
          node --test tests/desktop/dependencies.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'pnpm installation and cache reuse failed' }
      - name: Build installer and immutable runtime components
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./desktop/package.ps1 -PublishRuntimes
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Test actual installation, repair, failure and uninstall
        shell: pwsh
        run: ./tests/desktop/installer.test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            .cache/release/*-Setup.exe
            .cache/release/*-Setup.exe.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-installer-logs
          path: .cache/installer-smoke/*.log
  images:
    needs: [source, verify, windows]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.source.outputs.version }}
      source_ref: ${{ needs.source.outputs.revision }}
  publish:
    needs: [source, windows, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release
      - name: Publish matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.source.outputs.version }}
          TAG: ${{ needs.source.outputs.tag }}
        run: |
          cd release
          sha256sum --check *.sha256
          cat > notes.md <<EOF
          Windows: download and run FrameStudio-v${VERSION}-win-x64-Setup.exe. Setup checks and installs missing dependencies, creates shortcuts and provides an uninstaller. Node dependencies use the persistent pnpm store. Speech models are optional downloads from Settings.

          Docker images (built from the same tag):
          - ghcr.io/jianjianai/frame-studio/app:${VERSION}
          - ghcr.io/jianjianai/frame-studio/speech:${VERSION}

          Both Windows installer checks and the complete server release gate passed before publication. Publishing does not switch a production server.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./*-Setup.exe ./*.sha256 --clobber
          else
            gh release create "$TAG" ./*-Setup.exe ./*.sha256 --verify-tag --title "FRAME Studio $VERSION" --notes-file notes.md --generate-notes
          fi
