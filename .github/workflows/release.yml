name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag to release (without v)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.source.outputs.version }}
      revision: ${{ steps.source.outputs.revision }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && format('refs/tags/v{0}', inputs.version) || github.ref }}
      - id: source
        env:
          TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$TAG" = "v$VERSION" || { echo 'Tag and package version differ'; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: source
    uses: ./.github/workflows/verify.yml
    with:
      source_ref: ${{ needs.source.outputs.revision }}
  windows:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: "26.8.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        shell: pwsh
        run: |
          npm install --global pnpm@12.4.2
          if ($LASTEXITCODE -ne 0) { throw 'pnpm installation failed' }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
      - name: Test dependency provisioning
        shell: pwsh
        run: |
          ./tests/desktop/bootstrap.test.ps1
          node --test tests/desktop/dependencies.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'pnpm installation and cache reuse failed' }
          ./tests/desktop/download.test.ps1
          ./tests/desktop/github-cli.test.ps1
          ./tests/desktop/shortcut.test.ps1
      - name: Build installer and immutable runtime components
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./desktop/package.ps1 -PublishRuntimes
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Test actual installation, repair, failure and uninstall
        shell: pwsh
        run: ./tests/desktop/installer.test.ps1
      - name: Test native Windows center and browser workbench
        shell: pwsh
        run: ./tests/desktop/product.test.ps1 -CacheData .cache/installer-smoke/Data
      - name: Test verified update application and failed update recovery
        shell: pwsh
        run: ./tests/desktop/update-install.test.ps1 -CacheData .cache/installer-smoke/Data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-product-evidence
          path: |
            .cache/desktop-product-smoke-*/screens/*
            .cache/desktop-update-smoke-*/screens/*
            .cache/desktop-product-smoke-*/Data/*.log
            .cache/desktop-update-smoke-*/Data/*.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            .cache/release/*-Setup.exe
            .cache/release/*-Setup.exe.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-installer-logs
          path: .cache/installer-smoke/*.log
  images:
    needs: [source, verify, windows]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.source.outputs.version }}
      source_ref: ${{ needs.source.outputs.revision }}
  publish:
    needs: [source, windows, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release
      - name: Publish matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.source.outputs.version }}
          TAG: ${{ needs.source.outputs.tag }}
        run: |
          cd release
          sha256sum --check *.sha256
          cat > notes.md <<EOF
          Windows: download and run FrameStudio-v${VERSION}-win-x64-Setup.exe. The full workbench opens in your default browser. The native Windows control center manages dependencies, repairs, restart, logs and automatic updates. Left-click the tray icon to open the browser; right-click for the control center or exit.

          Setup checks and installs missing dependencies and creates shortcuts plus an uninstaller. App updates reuse the tools, Python environment and persistent pnpm store. Speech models are optional downloads from Settings. Local AI uses your installed Codex or Claude CLI.

          Docker images (built from the same tag):
          - ghcr.io/jianjianai/frame-studio/app:${VERSION}
          - ghcr.io/jianjianai/frame-studio/speech:${VERSION}

          The actual Windows installer, native control center, browser creation/preview/MP4 export, verified update installation and failure recovery, and complete server release gate passed before publication. Publishing does not switch a production server.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./*-Setup.exe ./*.sha256 --clobber
          else
            gh release create "$TAG" ./*-Setup.exe ./*.sha256 --verify-tag --title "FRAME Studio $VERSION" --notes-file notes.md --generate-notes
          fi
