name: Release
run-name: Release v${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag to release (without v)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.source.outputs.version }}
      revision: ${{ steps.source.outputs.revision }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}
      - id: source
        env:
          TAG: v${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo 'Run the publishing workflow on main to share release caches'; exit 1; }
          VERSION=$(node -p "require('./package.json').version")
          test "$TAG" = "v$VERSION" || { echo 'Tag and package version differ'; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  windows:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Install pnpm
        shell: pwsh
        run: |
          npm install --global pnpm@12.4.2
          if ($LASTEXITCODE -ne 0) { throw 'pnpm installation failed' }
      - name: Restore pnpm package store
        uses: actions/cache@v4
        with:
          path: .cache/pnpm-store
          key: windows-pnpm-12.4.2-node-24-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc') }}
          restore-keys: windows-pnpm-12.4.2-node-24-
      - name: Restore installer compiler
        uses: actions/cache@v4
        with:
          path: .cache/build-tools/nsis
          key: windows-nsis-${{ hashFiles('desktop/get-compiler.ps1') }}
      - name: Resolve published runtime components
        id: runtimes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (Test-Path -LiteralPath ./desktop/runtime-assets.ps1) {
            $plan = ./desktop/runtime-assets.ps1
          } else {
            # Older tags used unconditional build tool setup.
            $plan = @{Missing=@('tools','speech')}
          }
          "tools=$($plan.Missing -contains 'tools')".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          "speech=$($plan.Missing -contains 'speech')".ToLowerInvariant() >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        if: steps.runtimes.outputs.speech == 'true'
        with:
          python-version: "3.11"
      - name: Install FFmpeg for a new tools component
        if: steps.runtimes.outputs.tools == 'true'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
      - name: Install application build dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --prefer-offline --store-dir .cache/pnpm-store
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Restore pinned T3 Code compiled bundle
        uses: actions/cache@v4
        with:
          path: .cache/t3-generated
          key: windows-t3-node-24-${{ hashFiles('integrations/t3-code/**', 'scripts/build-t3.mjs', 'server/local-tools.mjs') }}
      - name: Build installer and immutable runtime components
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./desktop/package.ps1 -PublishRuntimes
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          include-hidden-files: true
          compression-level: 0
          path: |
            .cache/release/*-Setup.exe
            .cache/release/*-Setup.exe.sha256
          if-no-files-found: error
  images:
    needs: source
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.source.outputs.version }}
      source_ref: ${{ needs.source.outputs.revision }}
  publish:
    needs: [source, windows, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release
      - name: Publish matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.source.outputs.version }}
          TAG: ${{ needs.source.outputs.tag }}
        run: |
          cd release
          sha256sum --check *.sha256
          cat > notes.md <<EOF
          Windows: download and run FrameStudio-v${VERSION}-win-x64-Setup.exe. The full workbench opens in your default browser. The native Windows control center manages dependencies, repairs, restart, logs and automatic updates. Left-click the tray icon to open the browser; right-click for the control center or exit.

          Setup checks and installs missing dependencies and creates shortcuts plus an uninstaller. App updates reuse the tools, Python environment and persistent pnpm store. Speech models are optional downloads from Settings. Local AI uses your installed Codex or Claude CLI.

          Docker images (built from the same tag):
          - ghcr.io/jianjianai/frame-studio/app:${VERSION}
          - ghcr.io/jianjianai/frame-studio/speech:${VERSION}

          The installer and Docker images are built from the same source tag. This workflow builds and publishes release artifacts; functional verification is performed separately. Publishing does not switch a production server.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./*-Setup.exe ./*.sha256 --clobber
          else
            gh release create "$TAG" ./*-Setup.exe ./*.sha256 --verify-tag --title "FRAME Studio $VERSION" --notes-file notes.md --generate-notes
          fi
