name: Container images
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_ref:
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frame-studio/app
            dockerfile: deploy/Dockerfile
          - image: frame-studio/speech
            dockerfile: speech/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          ACTUAL=$(node -p "require('./package.json').version")
          test "$REQUESTED" = "$ACTUAL" || { echo 'Requested version does not match source package'; exit 1; }
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/jianjianai/${{ matrix.image }}:${{ inputs.version }}
            ghcr.io/jianjianai/${{ matrix.image }}:sha-${{ steps.version.outputs.revision }}
          build-args: REVISION=${{ steps.version.outputs.revision }}
          cache-from: |
            type=registry,ref=ghcr.io/jianjianai/${{ matrix.image }}:buildcache
            type=gha,scope=${{ matrix.image }}
          cache-to: type=registry,ref=ghcr.io/jianjianai/${{ matrix.image }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
      - name: Record published digest
        env:
          IMAGE: ghcr.io/jianjianai/${{ matrix.image }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ steps.version.outputs.revision }}
        run: |
          printf '%s:%s@%s\nSource: %s\n' "$IMAGE" "$VERSION" "$DIGEST" "$REVISION" >> "$GITHUB_STEP_SUMMARY"
