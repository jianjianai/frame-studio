name: Release verification
on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source ref to verify
        required: false
        type: string
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source ref to verify
        required: true
        type: string
      graphics_diagnostic:
        description: Run only the mixed-renderer diagnostic (not a release gate)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: frame
          POSTGRES_PASSWORD: frame-test-only
          POSTGRES_DB: frame_test_release
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U frame -d frame_test_release"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned tools and browser prerequisites
        run: |
          npm install --global pnpm@12.4.2 @openai/codex@0.158.0 @anthropic-ai/claude-code@2.1.283
          pnpm install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install -y ffmpeg git-lfs fonts-noto-cjk
          pnpm exec playwright install --with-deps chromium
      - name: Build candidate executor without publishing
        if: ${{ !inputs.graphics_diagnostic }}
        run: docker build -f deploy/Dockerfile -t frame-studio:verification --build-arg REVISION="$(git rev-parse HEAD)" .
      - name: Run the same release gate used for local releases
        env:
          FRAME_TEST_DATABASE_URL: postgres://frame:frame-test-only@127.0.0.1:5432/frame_test_release
          FRAME_TEST_EXECUTOR: "1"
          FRAME_TEST_HOST_ROOT: ${{ github.workspace }}
          FRAME_EXECUTOR_IMAGE: frame-studio:verification
          GRAPHICS_DIAGNOSTIC: ${{ inputs.graphics_diagnostic }}
        run: |
          BROWSER=$(node --input-type=module -e "import {chromium} from '@playwright/test'; console.log(chromium.executablePath())")
          # Only trusted repository fixtures run here; hosted runners have no GPU.
          BROWSER_WRAPPER="$RUNNER_TEMP/frame-chromium"
          printf '#!/bin/sh\nexec "%s" "$@" --use-gl=angle --use-angle=swiftshader-webgl --enable-unsafe-swiftshader\n' "$BROWSER" > "$BROWSER_WRAPPER"
          chmod +x "$BROWSER_WRAPPER"
          FRAME_BROWSER="$BROWSER_WRAPPER" node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { launchBrowser } from './scripts/browser.mjs';
          const browser = await launchBrowser();
          try {
            const page = await browser.newPage();
            const result = await page.evaluate(() => {
              const canvas = document.createElement('canvas');
              let error;
              canvas.addEventListener('webglcontextcreationerror', event => { error = event.statusMessage; });
              const gl = canvas.getContext('webgl2', { alpha: true, antialias: true, preserveDrawingBuffer: true });
              return { available: !!gl, renderer: gl?.getParameter(gl.RENDERER), error };
            });
            console.log('CI WebGL2 preflight', result);
            assert.equal(result.available, true, JSON.stringify(result));
          } finally { await browser.close(); }
          JS
          if [ "$GRAPHICS_DIAGNOSTIC" = true ]; then
            sudo env PATH="$PATH" FRAME_BROWSER="$BROWSER_WRAPPER" DEBUG=pw:browser \
              node --test tests/server/mixed-composition.test.mjs
            exit
          fi
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo env PATH="$PATH" FRAME_BROWSER="$BROWSER_WRAPPER" \
            FRAME_TEST_DATABASE_URL="$FRAME_TEST_DATABASE_URL" \
            FRAME_TEST_EXECUTOR="$FRAME_TEST_EXECUTOR" \
            FRAME_TEST_HOST_ROOT="$FRAME_TEST_HOST_ROOT" \
            FRAME_EXECUTOR_IMAGE="$FRAME_EXECUTOR_IMAGE" pnpm verify:release
