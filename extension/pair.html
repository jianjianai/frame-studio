<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>连接 FRAME</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1d2129;
        --muted: #6b7280;
        --ok: #2f9e6b;
        --danger: #d64545;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15171c;
          --fg: #dce0e7;
          --muted: #8e96a3;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 15px/1.6 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 420px;
        padding: 24px;
        text-align: center;
        display: grid;
        gap: 12px;
        justify-items: center;
      }
      img {
        width: 48px;
        height: 48px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .ok {
        color: var(--ok);
      }
      .error {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icons/128.png" alt="" />
      <h1 id="title">正在连接 FRAME…</h1>
      <p id="detail"></p>
    </main>
    <script src="pair.js" type="module"></script>
  </body>
</html>
