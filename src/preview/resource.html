<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FRAME Resource</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      #view {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        box-shadow: 0 0 0 1px rgb(127 127 127 / 0.25);
      }
      #message {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        padding: 8px 12px;
        border-radius: 6px;
        font: 13px/1.5 system-ui, sans-serif;
        color: #fff;
        background: rgb(170 40 50 / 0.94);
        white-space: pre-wrap;
        max-height: 50%;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="view"><canvas></canvas></div>
    <div id="message" hidden></div>
    <script type="module" src="/src/preview/resource.ts"></script>
  </body>
</html>
