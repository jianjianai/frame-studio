# docker compose -f deploy/compose.yaml up -d --build
services:
  frame:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: frame-studio:9
    restart: unless-stopped
    ports:
      - "4310:4310"
    environment:
      # Required when the studio is reachable from the network.
      FRAME_PASSWORD: ${FRAME_PASSWORD:?set FRAME_PASSWORD}
      # Public https:// address behind your reverse proxy (needed for microphone recording).
      FRAME_PUBLIC_URL: ${FRAME_PUBLIC_URL:-}
    volumes:
      - ./data:/data
    shm_size: "1gb"
